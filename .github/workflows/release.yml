name: Release
# Builds, signs, notarizes and uploads DMG/ZIP to a GitHub Release when a
# v* tag is pushed. Requires these repository secrets (never commit them):
#   CSC_LINK                     base64 of the Developer ID Application .p12
#                                (imported by the 'Import signing certificate' step)
#   CSC_KEY_PASSWORD             .p12 password
#   APPLE_API_KEY                contents of the App Store Connect API key (.p8)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER   from App Store Connect > Keys
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: macos-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Import the certificate into our own keychain instead of passing
      # CSC_LINK to electron-builder: its temporary-keychain step failed on
      # the macOS runner ("SecKeychainUnlock: passphrase not correct"). A
      # wrong CSC_KEY_PASSWORD fails loudly right here at `security import`.
      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.CSC_LINK }}
          CERT_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning
      - name: Write API key
        run: |
          printf '%s' "${{ secrets.APPLE_API_KEY }}" > "${{ runner.temp }}/AuthKey.p8"
      # Build only (no electron-builder upload): its parallel uploads raced and
      # created two draft releases, and uploaded DMGs *before* the hook that
      # notarizes and staples them had run, so the published files had no
      # stapled ticket. Uploading ourselves afterwards fixes both.
      - name: Build, sign and notarize
        run: npm run dist -- --publish never
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify DMGs are notarized and stapled
        run: |
          for f in release/*.dmg; do
            xcrun stapler validate "$f"
          done
      # One draft release, created once. File names have no version in them
      # (PAPI-arm64.dmg, PAPI-x64.dmg), so
      #   https://github.com/<owner>/<repo>/releases/latest/download/PAPI-arm64.dmg
      # always serves the newest published release. Published manually.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat .github/release-header.md
            gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --draft --title "PAPI ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
